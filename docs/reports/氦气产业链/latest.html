<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氦气产业链 - 历史报告</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .card-glass {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 15px 40px rgba(118, 75, 162, 0.35);
            border-radius: 20px;
        }
        
        .pulse-icon {
            animation: pulse 3s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        select {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        select:hover {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body class="pb-20">
    <!-- 导航栏 -->
    <nav class="glass-nav fixed top-0 left-0 right-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa fa-cloud text-white text-2xl pulse-icon"></i>
                <span class="text-white font-bold text-xl">氦气</span>
            </div>
            <div class="flex items-center space-x-2 flex-wrap gap-2">
                <a href="../../index.html" class="text-white/80 hover:text-white text-sm transition-colors px-2 py-1 rounded hover:bg-white/10">
                    <i class="fa fa-home mr-1"></i>首页
                </a>
                <a href="../../industry_chain/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-2 py-1 rounded">
                    <i class="fa fa-link mr-1"></i>产业链
                </a>
                <a href="../../催化日历/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-2 py-1 rounded">
                    <i class="fa fa-calendar mr-1"></i>催化日历
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="max-w-4xl mx-auto px-4 pt-24">
        <!-- 页面标题 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white mb-2">
                <i class="fa fa-cloud mr-2"></i>氦气产业链
            </h1>
            <p class="text-white/80">历史报告查询</p>
        </div>

        <!-- 时间选择器 -->
        <div class="card-glass p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-bold gradient-text uppercase tracking-wider">
                    <i class="fa fa-calendar mr-2"></i>选择报告日期
                </h2>
                <select id="reportSelector" onchange="loadReport()">
                    <option value="氦气产业链标准日报.html">标准日报</option>
                    <option value="20260514_氦气产业链日报.html">2026年5月14日</option>
                    <option value="20260512_氦气产业链日报.html">2026年5月12日</option>
                </select>
            </div>
            
            <!-- 报告内容 iframe -->
            <div class="mt-4">
                <iframe id="reportFrame" src="氦气产业链标准日报.html" 
                    style="width: 100%; height: 800px; border: none; border-radius: 12px;"></iframe>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="text-center text-white/60 text-sm py-8">
            <p>本报告由AI自动生成，仅供参考，不构成投资建议</p>
            <p class="mt-2">
                <i class="fa fa-github mr-1"></i>GitHub Pages: boya357.github.io
            </p>
        </div>
    </div>

    <script>
        function loadReport() {
            var selector = document.getElementById('reportSelector');
            var selectedFile = selector.value;
            document.getElementById('reportFrame').src = selectedFile;
        }
    </script>
</body>
</html>
