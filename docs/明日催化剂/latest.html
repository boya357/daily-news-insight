<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转...</title>
    <script>
        // Get the current path and calculate redirect
        var currentPath = window.location.pathname;
        var basePath = currentPath.substring(0, currentPath.indexOf('/docs/') + 1);
        var targetUrl = basePath + 'docs/tomorrow_catalyst/latest.html';
        
        // Also preserve hash and query string
        targetUrl += window.location.search + window.location.hash;
        
        // Perform redirect
        window.location.replace(targetUrl);
    </script>
    <meta http-equiv="refresh" content="0; url=../../tomorrow_catalyst/latest.html">
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .message { text-align: center; color: #666; }
        a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="message">
        <p>页面已迁移，正在跳转...</p>
        <p>如果没有自动跳转，请<a href="../../tomorrow_catalyst/latest.html">点击这里</a></p>
    </div>
</body>
</html>
