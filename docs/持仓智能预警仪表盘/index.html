<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=../portfolio_dashboard/">
    <link rel="canonical" href="../portfolio_dashboard/">
    <title>页面已迁移 - 投资研究中心</title>
    <link rel="stylesheet" href="../assets/global-dark.css">
    <style>
        body{
            background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            color:rgba(255,255,255,0.9);font-family:'Noto Sans SC',sans-serif;
            margin:0;
        }
        .box{
            background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.12);border-radius:20px;
            padding:40px 50px;text-align:center;max-width:480px;
        }
        h1{font-size:1.5rem;margin-bottom:12px;}
        p{color:rgba(255,255,255,0.7);margin-bottom:20px;}
        a{color:#a78bfa;font-weight:600;}
        .spinner{
            width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);
            border-top-color:#a78bfa;border-radius:50%;
            animation:spin 0.8s linear infinite;margin:0 auto 16px;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h1>页面已迁移</h1>
        <p>正在跳转到新版地址，如未自动跳转请点击下方链接：</p>
        <p><a href="../portfolio_dashboard/">持仓智能预警仪表盘 →</a></p>
    </div>
</body>
</html>
