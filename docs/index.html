<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产业研究报告中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .report-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .report-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .report-card h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.4em;
        }

        .report-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.9em;
        }

        .report-desc {
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .tag {
            display: inline-block;
            background: #e3f2fd;
            color: #1565c0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .tag.hot {
            background: #ffebee;
            color: #c62828;
        }

        .view-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .view-btn:hover {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 50px;
            opacity: 0.8;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 产业研究报告中心</h1>
            <p>深度挖掘产业链价值，聚焦AI时代核心赛道</p>
        </div>

        <div class="report-card" onclick="location.href='industry_chain/latest.html'">
            <h2>💎 金刚石散热产业链深度分析报告</h2>
            <div class="report-meta">
                <span class="meta-item">📅 发布时间：2026年6月1日</span>
                <span class="meta-item">📄 报告页数：8大章节</span>
                <span class="meta-item">⭐ 最新更新</span>
            </div>
            <p class="report-desc">
                全面分析金刚石散热产业链，涵盖上下游梳理、核心标的筛选、英伟达Rubin平台关联度排名。
                包含产业链图谱、关联度评分模型、关键数据交叉验证清单、风险提示与投资建议。
            </p>
            <div>
                <span class="tag hot">🔥 热点赛道</span>
                <span class="tag">AI算力</span>
                <span class="tag">散热材料</span>
                <span class="tag">英伟达</span>
                <span class="tag">Rubin平台</span>
            </div>
            <br>
            <a href="industry_chain/latest.html" class="view-btn">查看完整报告 →</a>
        </div>

        <div class="footer">
            <p>⚠️ 免责声明：本报告仅供参考，不构成任何投资建议。投资有风险，入市需谨慎。</p>
            <p style="margin-top:10px;">© 2026 产业研究报告中心. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
