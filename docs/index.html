    <script>

        function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }
        
        function renderToday() {

                        </div>
                        <i class="fa fa-chevron-right text-gray-300 text-xs"></i>
                    </div>
                </a>`;
            if (!wknd) {
                html += `
