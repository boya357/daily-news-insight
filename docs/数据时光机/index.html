    <div class="max-w-5xl mx-auto px-4 pt-24">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">⏳ 数据时光机</h1>
            <p class="text-white/70">穿越历史数据，回溯每一个关键时刻的市场状态</p>
        </div>
        
        <!-- 日期选择器 -->
        <div class="card p-4 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-gray-700">选择日期</h3>
                <div class="flex gap-2">
                    <select id="dateSelect" class="px-3 py-2 rounded-lg border border-gray-200 text-sm" onchange="switchDate(this.value)">
                        <option value="2026-06-12">2026-06-12</option>
                        <option value="2026-06-11">2026-06-11</option>
                        <option value="2026-06-10">2026-06-10</option>
                        <option value="2026-06-09">2026-06-09</option>
                        <option value="2026-06-08">2026-06-08</option>
                    </select>
                </div>
            </div>
            <div class="text-center">
                <span class="text-gray-400 text-sm">历史数据: 5天</span>
            </div>
        </div>
        
        <!-- 收益趋势图 -->
        <div class="card p-6 mb-6">
            <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-chart-line text-blue-500"></i>
                收益趋势
            </h3>
            <div id="trendChart" class="flex items-end justify-around h-40 border-b border-gray-200 pb-2">
                <!-- 动态渲染 -->
            </div>
        </div>
        
        <!-- 持仓概览 -->
        <div class="card p-6 mb-6">
            <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-wallet text-green-500"></i>
                持仓概览
            </h3>
            <div id="portfolioStats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <!-- 动态渲染 -->
            </div>
        </div>
        
        <!-- 持仓明细 -->
        <div class="card p-6">
            <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-list text-purple-500"></i>
                持仓明细
            </h3>
            <div id="stocksList">
                <!-- 动态渲染 -->
            </div>
        </div>
    </div>
    
    
    <script>
        const availableDates = ['2026-06-08', '2026-06-09', '2026-06-10', '2026-06-11', '2026-06-12'];
        let currentDate = '2026-06-12';
        let historyData = {};

        function formatPct(val) {
            const pct = (val * 100).toFixed(2);
            return val >= 0 ? '+' + pct + '%' : pct + '%';
        }

        function getPctColor(val) {
            return val >= 0 ? 'text-green-500' : 'text-red-500';
        }

        function getStockShortName(name) {
            return name.substring(0, 2);
        }

        // 渲染收益趋势图（显示从最早到当前日期的趋势）
        function renderTrendChart(targetDate) {
            const chart = document.getElementById('trendChart');
            const dates = availableDates.filter(d => d <= targetDate).sort();
            if (dates.length === 0) {
                chart.innerHTML = '<p class="text-gray-400 text-center w-full">暂无数据</p>';
                return;
            }

            // 找出最大绝对值用于计算柱子高度
            let maxAbs = 0;
            dates.forEach(d => {
                if (historyData[d] && historyData[d].portfolio) {
                    const ret = Math.abs(historyData[d].portfolio.total_return);
                    if (ret > maxAbs) maxAbs = ret;
                }
            });
            if (maxAbs === 0) maxAbs = 0.2; // 避免除以0

            let html = '';
            dates.forEach(d => {
                const data = historyData[d]?.portfolio;
                if (!data) return;
                const ret = data.total_return;
                const heightPct = (Math.abs(ret) / maxAbs) * 100;
                const color = ret >= 0 ? 'bg-green-500' : 'bg-red-500';
                const dateLabel = d.substring(5); // MM-DD
                
                html += `
                    <div class="flex flex-col items-center">
                        <div class="text-xs text-gray-400 mb-1">${formatPct(ret)}</div>
                        <div class="w-8 rounded-t ${color}" style="height: ${heightPct}px; min-height: 20px;"></div>
                        <div class="text-xs text-gray-400 mt-1">${dateLabel}</div>
                    </div>
                `;
            });

            chart.innerHTML = html;
        }

        // 渲染持仓概览
        function renderPortfolioStats(targetDate) {
            const container = document.getElementById('portfolioStats');
            const data = historyData[targetDate]?.portfolio;
            
            if (!data) {
                container.innerHTML = '<p class="text-gray-400 col-span-full text-center">暂无数据</p>';
                return;
            }

            const totalReturn = data.total_return;
            const profitCount = data.profit_count || 0;
            const lossCount = data.loss_count || 0;
            const healthScore = data.health_score || 0;

            container.innerHTML = `
                <div class="card p-4 text-center">
                    <div class="text-gray-400 text-sm mb-1">总收益</div>
                    <div class="text-2xl font-bold ${getPctColor(totalReturn)}">${formatPct(totalReturn)}</div>
                </div>
                <div class="card p-4 text-center">
                    <div class="text-gray-400 text-sm mb-1">持仓数量</div>
                    <div class="text-2xl font-bold text-gray-700">${data.stock_count || 0}只</div>
                </div>
                <div class="card p-4 text-center">
                    <div class="text-gray-400 text-sm mb-1">盈利/亏损</div>
                    <div class="text-lg font-bold">
                        <span class="text-green-500">${profitCount}盈</span>
                        /
                        <span class="text-red-500">${lossCount}亏</span>
                    </div>
                </div>
                <div class="card p-4 text-center">
                    <div class="text-gray-400 text-sm mb-1">健康分</div>
                    <div class="text-2xl font-bold text-yellow-500">${healthScore}分</div>
                </div>
            `;
        }

        // 渲染持仓明细
        function renderStocksList(targetDate) {
            const container = document.getElementById('stocksList');
            const stocks = historyData[targetDate]?.stocks;
            
            if (!stocks || stocks.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center py-4">暂无持仓数据</p>';
                return;
            }

            let html = '';
            stocks.forEach(stock => {
                const shortName = getStockShortName(stock.name);
                const priceColor = (stock.current_price >= stock.cost_price) ? 'text-green-500' : 'text-red-500';
                const gradient = stock.gradient || 'from-indigo-500 to-purple-500';
                
                html += `
                    <div class="card p-4 mb-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-gradient-to-br ${gradient} flex items-center justify-center text-white font-bold">
                                    ${shortName}
                                </div>
                                <div>
                                    <h4 class="font-bold text-gray-800">${stock.name}</h4>
                                    <p class="text-xs text-gray-400">${stock.id || stock.code}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-lg font-bold ${priceColor}">${stock.current_price}元</div>
                                <div class="text-xs text-gray-400">成本: ${stock.cost_price}元</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 切换日期
        function switchDate(date) {
            currentDate = date;
            renderDate(date);
        }

        // 渲染指定日期的数据
        function renderDate(date) {
            if (!historyData[date]) return;
            renderTrendChart(date);
            renderPortfolioStats(date);
            renderStocksList(date);
        }

        // 初始化：预加载所有数据
        async function init() {
            // 加载所有日期的数据
            for (const date of availableDates) {
                try {
                    const res = await fetch('../data/history/' + date + '.json');
                    historyData[date] = await res.json();
                } catch (e) {
                    console.error('加载数据失败:', date, e);
                }
            }

            // 填充日期选择器（倒序）
            const dateSelect = document.getElementById('dateSelect');
            dateSelect.innerHTML = '';
            const sortedDates = [...availableDates].sort().reverse();
            sortedDates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = date;
                if (date === currentDate) option.selected = true;
                dateSelect.appendChild(option);
            });

            // 渲染默认日期
            renderDate(currentDate);
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('show');
            document.body.style.overflow = document.getElementById('mobileMenu').classList.contains('show') ? 'hidden' : '';
        }

        // 启动
        init();
    </script>
