<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同花顺 深度分析 - 投资研究中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        * { font-family: 'Noto Sans SC', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            padding-top: 80px;
            color: white;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            padding: 0.75rem 1rem;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-link:hover { color: white; background: rgba(255,255,255,0.1); }
        .nav-link.active { color: white; font-weight: 600; }
        .score-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .tag {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            margin: 0.25rem;
        }
        .progress-bar {
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease;
        }
        .metric-card {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }
        .metric-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 0.25rem;
        }
        .metric-value {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">📊 投资研究中心</span>
            </div>
            <div class="flex items-center gap-1">
                <a href="../index.html" class="nav-link">首页</a>
                <a href="index.html" class="nav-link active">个股分析</a>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pb-20">
        
        <div class="glass-card p-8 mb-6 reveal">
            <div class="flex flex-wrap items-start justify-between gap-6">
                <div>
                    <div class="flex items-center gap-3 mb-2 flex-wrap">
                        <h1 class="text-3xl font-bold">同花顺</h1>
                        <span class="text-sm text-white/50">300033</span>
                    </div>
                    <div class="flex items-center gap-2 mb-4">
                        <span class="px-3 py-1 bg-purple-500/20 text-purple-300 rounded-full text-xs font-medium">
                            
                        </span>
                    </div>
                    <div class="flex items-baseline gap-3">
                        <span class="text-4xl font-bold" style="color: #ef4444">0.00</span>
                        <span class="text-lg font-semibold" style="color: #ef4444">
                            +0.00%</span>
                        <span class="text-sm text-white/50">
                            +0.00
                        </span>
                    </div>
                </div>
                
                <div class="text-center">
                    <div class="score-ring" style="background: conic-gradient(#ef4444 0.0deg, rgba(255,255,255,0.1) 0deg);">
                        <div style="background: #1e1b4b; width: 90px; height: 90px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <span style="color: #ef4444; font-size: 1.8rem;">0.0</span>
                        </div>
                    </div>
                    <div class="mt-2 text-sm text-white/70">综合评分</div>
                    <div class="text-lg font-bold" style="color: #ef4444">暂无</div>
                </div>
            </div>
        </div>
        
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="md:col-span-1 reveal">
                
            </div>
            <div class="md:col-span-1 reveal">
                
                
            </div>
        </div>
        
        <div class="reveal">
            
        </div>
    </div>

    <script>
        function initReveal() {
            const reveals = document.querySelectorAll('.reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });
            reveals.forEach(el => observer.observe(el));
        }
        document.addEventListener('DOMContentLoaded', function() {
            initReveal();
        });
    </script>
</body>
</html>
