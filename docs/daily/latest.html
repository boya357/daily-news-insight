<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日新闻洞察 - 报告列表</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f8f9fc 0%, #f0f2f8 100%);
            color: #2d3748;
            line-height: 1.8;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #718096;
        }
        
        .report-list {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        
        .report-item {
            display: flex;
            align-items: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #f8f9fc 0%, #f5f7fb 100%);
            border: 1px solid #e8ecf4;
        }
        
        .report-item:first-child {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }
        
        .report-item:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.15);
        }
        
        .report-icon {
            font-size: 28px;
            margin-right: 18px;
        }
        
        .report-info {
            flex: 1;
        }
        
        .report-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .report-date {
            font-size: 13px;
            opacity: 0.7;
        }
        
        .report-tag {
            background: rgba(255,255,255,0.25);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .report-tag.gray {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }
        
        .footer {
            text-align: center;
            padding: 30px;
            color: #a0aec0;
            font-size: 13px;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }
            
            .report-item {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">📊</div>
            <h1>每日新闻洞察</h1>
            <p>每日盘前重要催化与市场热点分析</p>
        </div>
        
        <div class="report-list">
            <a href="20260518_每日新闻洞察.html" class="report-item">
                <div class="report-icon">🆕</div>
                <div class="report-info">
                    <div class="report-title">每日新闻洞察 - 2026年5月18日</div>
                    <div class="report-date">六大重磅催化密集落地</div>
                </div>
                <div class="report-tag">今日</div>
            </a>
            
            <a href="20260517_每日新闻洞察.html" class="report-item">
                <div class="report-icon">📅</div>
                <div class="report-info">
                    <div class="report-title">每日新闻洞察 - 2026年5月17日</div>
                    <div class="report-date">非交易日，周一关键变盘节点</div>
                </div>
                <div class="report-tag gray">历史</div>
            </a>
        </div>
        
        <div class="footer">
            <p>📊 每日新闻洞察报告列表</p>
        </div>
    </div>
</body>
</html>
