            /* Glass-Nav 玻璃态导航栏 */
            .glass-nav {
                position: fixed;

                right: 0;

                background: rgba(0, 0, 0, 0.3);

                transition: background 0.3s ease;
                isolation: isolate !important;
                pointer-events: auto !important;
            }
            
            .glass-nav.scrolled {
                background: rgba(0, 0, 0, 0.7);
            }
            
            .glass-nav * {
                position: relative;
                z-index: 2147483647 !important;
                pointer-events: auto !important;
            }
            
            .glass-nav-inner {
                max-width: 80rem;
                margin: 0 auto;
                padding: 0 1rem;
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

                align-items: center;
                gap: 12px;
                text-decoration: none;
            }
            
            .glass-nav-logo-icon {
                width: 32px;
                height: 32px;
                border-radius: 8px;
                background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
            }
            
            .glass-nav-logo-text {
                color: white;
                font-weight: 700;
                font-size: 18px;
            }
            
            .glass-nav-links {
                display: flex;
                align-items: center;
                gap: 4px;
                flex-wrap: wrap;
            }
            
            .glass-nav-link {
                padding: 6px 12px;
                border-radius: 8px;
                text-decoration: none;
                font-size: 14px;
                font-weight: 500;
                color: rgba(255, 255, 255, 0.8);
                transition: all 0.2s ease;
            }
            
            .glass-nav-link:hover {
                color: white;
                background: rgba(255, 255, 255, 0.1);
            }
            
            .glass-nav-link.active {
                color: white;
                background: rgba(255, 255, 255, 0.15);
            }
            
            .hamburger-btn {
                display: none;
                background: rgba(255, 255, 255, 0.1);
                border: none;
                width: 36px;
                height: 36px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 16px;
                color: white;
                align-items: center;
                justify-content: center;
            }
            
            /* 移动端菜单 - 玻璃态深色 */
            .mobile-menu {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(15, 23, 42, 0.95);
                backdrop-filter: blur(20px);
                z-index: 2147483646;
                flex-direction: column;
                padding: 80px 24px 24px;
            }
            
            .mobile-menu.show {
                display: flex;
            }
            
            .mobile-menu-item {
                padding: 14px 16px;
                border-radius: 10px;
                text-decoration: none;
                font-size: 16px;
                font-weight: 500;
                color: rgba(255, 255, 255, 0.8);
                margin-bottom: 4px;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            
            .mobile-menu-item:hover {
                color: white;
                background: rgba(255, 255, 255, 0.1);
            }
            
            .mobile-menu-item.active {
                color: white;
                background: rgba(255, 255, 255, 0.15);
            }
            
            .close-menu-btn {
                position: absolute;
                top: 16px;
                right: 16px;
                background: rgba(255, 255, 255, 0.1);
                border: none;
                width: 36px;
                height: 36px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 16px;
                color: white;
            }
            
            @media (max-width: 768px) {
                .glass-nav-links {
                    display: none;
                }
                .hamburger-btn {
                    display: flex;
                }
            }
        </style>

            // 导航栏滚动加深效果
            window.addEventListener('scroll', function() {
                const nav = document.querySelector('.glass-nav');
                if (nav) {
                    if (window.scrollY > 50) {
                        nav.classList.add('scrolled');
                    } else {
                        nav.classList.remove('scrolled');
                    }
                }
            });
        </script>
