<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{REPORT_TITLE}} | {{REPORT_DATE}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        
        * { font-family: 'Noto Sans SC', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        /* 全站统一glass-nav导航栏样式 */
        .glass-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* 阅读进度条 */
        #progressBar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            z-index: 9999;
            transition: width 0.1s ease;
        }
        
        /* 回到顶部按钮 */
        #backToTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            z-index: 9998;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        #backToTop:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        #backToTop.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 操作按钮组 */
        .action-buttons {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            gap: 10px;
            z-index: 9997;
        }
        .action-btn {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            color: #6366f1;
        }
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
        }
        
        /* 标签样式 */
        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        .tag-primary { background: rgba(99,102,241,0.1); color: #6366f1; }
        .tag-success { background: rgba(34,197,94,0.1); color: #22c55e; }
        .tag-warning { background: rgba(245,158,11,0.1); color: #f59e0b; }
        
        /* 平滑滚动 */
        html { scroll-behavior: smooth; }
        
        /* 打印优化 */
        @media print {
            #progressBar, #backToTop, .action-buttons { display: none !important; }
            nav { position: relative !important; }
            body { background: white !important; }
        }
    </style>
</head>
<body>
    <!-- 阅读进度条 -->
    <div id="progressBar"></div>

    <!-- 全站统一导航栏 - 12个固定链接 -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-nav">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                    <span class="text-white text-sm font-bold">📊</span>
                </div>
                <span class="text-white font-bold text-lg">投资研究中心</span>
            </div>
            <div class="flex items-center space-x-1 flex-wrap gap-1">
                <a href="/daily-news-insight/index.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">首页</a>
                <a href="/daily-news-insight/daily/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">日报</a>
                <a href="/daily-news-insight/intraday/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">盘中</a>
                <a href="/daily-news-insight/aftermarket/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">盘后</a>
                <a href="/daily-news-insight/industry_chain/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">产业链</a>
                <a href="/daily-news-insight/weekly_review/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">周复盘</a>
                <a href="/daily-news-insight/weekly_outlook/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">周三前瞻</a>
                <a href="/daily-news-insight/催化日历/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">催化日历</a>
                <a href="/daily-news-insight/周末速递/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">周末速递</a>
                <a href="/daily-news-insight/明日催化剂/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">明日催化</a>
                <a href="/daily-news-insight/s级催化扫描/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">S级催化</a>
                <a href="/daily-news-insight/monthly/latest.html" class="text-white/80 hover:text-white hover:bg-white/10 text-sm transition-colors px-3 py-1.5 rounded-lg">月报</a>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="max-w-4xl mx-auto px-4 pt-24 pb-20">
        <!-- 报告头部 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white mb-3">{{REPORT_TITLE}}</h1>
            <p class="text-white/80">{{REPORT_DATE}}</p>
        </div>

        <!-- 报告内容容器 -->
        <div class="bg-white/95 rounded-3xl p-8 shadow-2xl">
            {{REPORT_CONTENT}}
        </div>

        <!-- 报告信息区 -->
        <div class="bg-white/95 rounded-3xl p-8 shadow-2xl mt-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">📋 报告信息</h2>
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <table class="w-full text-sm text-gray-700">
                        <tbody>
                            <tr class="border-b border-gray-200">
                                <td class="py-3 font-medium w-1/3">报告类型</td>
                                <td class="py-3"><span class="tag tag-primary">{{REPORT_TYPE}}</span></td>
                            </tr>
                            <tr class="border-b border-gray-200">
                                <td class="py-3 font-medium">发布日期</td>
                                <td class="py-3">{{REPORT_DATE}}</td>
                            </tr>
                            <tr>
                                <td class="py-3 font-medium">模板版本</td>
                                <td class="py-3"><span class="tag tag-success">MLCC Pro v2.0</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div>
                    <h4 class="font-bold text-gray-800 mb-3">核心标签</h4>
                    <div class="flex flex-wrap gap-2">
                        {{REPORT_TAGS}}
                    </div>
                </div>
            </div>
            
            <!-- 免责声明 -->
            <div class="mt-8 pt-6 border-t border-gray-200">
                <div class="bg-gray-50 rounded-xl p-5">
                    <h5 class="font-bold text-gray-800 mb-3">📜 免责声明</h5>
                    <p class="text-sm text-gray-600 leading-relaxed">
                        本报告仅供参考，不构成任何投资建议。报告中的信息来源于公开渠道，我们对信息的准确性和完整性不作任何保证。
                        投资者据此操作，风险自担。市场有风险，投资需谨慎。
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- 操作按钮组 -->
    <div class="action-buttons">
        <button onclick="exportPDF()" class="action-btn" title="打印/导出PDF (选择'另存为PDF')">
            <span class="text-xl">📄</span>
        </button>
        <button onclick="shareReport()" class="action-btn" title="分享报告">
            <span class="text-xl">🔗</span>
        </button>
    </div>

    <!-- 回到顶部按钮 -->
    <button id="backToTop" onclick="scrollToTop()" title="回到顶部">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
        </svg>
    </button>

    <script>
        // ==================== MLCC Pro 核心功能 ====================

        // 阅读进度条 + 回到顶部按钮
        window.addEventListener('scroll', function() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('progressBar').style.width = scrolled + '%';
            
            const backToTop = document.getElementById('backToTop');
            backToTop.classList.toggle('visible', winScroll > 300);
        });

        // 回到顶部
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 导出PDF - 使用浏览器原生打印
        function exportPDF() {
            window.print();
        }

        // 分享报告
        function shareReport() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: document.title, url: url });
            } else {
                navigator.clipboard.writeText(url).then(() => alert('链接已复制到剪贴板！'));
            }
        }
    </script>
</body>
</html>
