<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盘后速递 - 历史报告列表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .card-glass {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 15px 40px rgba(118, 75, 162, 0.35);
            border-radius: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card-glass:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(118, 75, 162, 0.45);
        }
        
        .pulse-icon {
            animation: pulse 3s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .new-badge {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="pb-20">
    <!-- 导航栏 -->
    <nav class="glass-nav fixed top-0 left-0 right-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa fa-line-chart text-white text-2xl pulse-icon"></i>
                <span class="text-white font-bold text-xl">盘后速递</span>
            </div>
            <div class="flex items-center space-x-2">
                <a href="../index.html" class="text-white/80 hover:text-white text-sm transition-colors">
                    <i class="fa fa-home mr-1"></i>首页
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="max-w-4xl mx-auto px-4 pt-24">
        <!-- 页面标题 -->
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-white mb-4">
                <i class="fa fa-archive mr-2"></i>历史报告列表
            </h1>
            <p class="text-white/80">每日盘后速递，精准把握市场脉搏</p>
        </div>

        <!-- 报告列表卡片 -->
        <div class="card-glass p-6">
            <h2 class="text-xl font-bold gradient-text mb-6">
                <i class="fa fa-calendar-check-o mr-2"></i>盘后速递报告
            </h2>
            
            <div class="space-y-4">
                <!-- 最新报告 -->
                <a href="20260525_盘后速递.html" class="block p-5 bg-gradient-to-r from-purple-50 to-indigo-50 rounded-xl border-2 border-purple-200 hover:border-purple-400 transition-all group">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <span class="new-badge text-white text-xs px-2 py-1 rounded-full mr-3 font-medium">
                                <i class="fa fa-bolt mr-1"></i>最新
                            </span>
                            <span class="font-bold text-gray-800 text-lg group-hover:text-purple-700 transition-colors">
                                2026年5月25日 盘后速递
                            </span>
                        </div>
                        <i class="fa fa-chevron-right text-purple-400 group-hover:text-purple-600 group-hover:translate-x-1 transition-all"></i>
                    </div>
                    <div class="mt-3 text-sm text-gray-600">
                        <span class="inline-flex items-center mr-4">
                            <i class="fa fa-arrow-up text-red-500 mr-1"></i>沪指 +0.96%
                        </span>
                        <span class="inline-flex items-center mr-4">
                            <i class="fa fa-microchip text-purple-500 mr-1"></i>芯片产业链爆发
                        </span>
                        <span class="inline-flex items-center">
                            <i class="fa fa-fire text-orange-500 mr-1"></i>科创50 +5.88%
                        </span>
                    </div>
                </a>

                <!-- 历史报告占位 -->
                <div class="p-5 bg-gray-50 rounded-xl border border-gray-200 opacity-60">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <span class="bg-gray-300 text-gray-600 text-xs px-2 py-1 rounded-full mr-3">
                                历史
                            </span>
                            <span class="font-medium text-gray-600">更多历史报告</span>
                        </div>
                        <i class="fa fa-clock-o text-gray-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="text-center text-white/60 text-sm py-8">
            <p>本报告由AI自动生成，仅供参考，不构成投资建议</p>
            <p class="mt-2">
                <i class="fa fa-github mr-1"></i>GitHub Pages: boya357.github.io
            </p>
        </div>
    </div>
</body>
</html>
