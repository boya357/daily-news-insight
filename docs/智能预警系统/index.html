    <script>
        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('show');
            document.body.style.overflow = document.getElementById('mobileMenu').classList.contains('show') ? 'hidden' : '';
        }
    </script>

    <script>
        function filterWarnings(type) {
            const cards = document.querySelectorAll('#warningsList > div');
            cards.forEach(card => {
                if (type === 'all') {
                    card.style.display = 'block';
                } else {
                    const typeMap = {
                        'danger': '危险预警',
                        'warning': '注意提醒', 
                        'info': '信息提示',
                        'success': '止盈提醒'
                    };
                    card.style.display = card.innerText.includes(typeMap[type] || '') ? 'block' : 'none';
                }
            });
        }
    </script>
