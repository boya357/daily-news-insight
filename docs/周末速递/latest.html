<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周末速递 - 市场洞察中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #1e293b; line-height: 1.6; min-height: 100vh; }
        .header { position: sticky; top: 0; background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.2); z-index: 100; padding: 0 24px; }
        .header-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; }
        .header-title { font-size: 17px; font-weight: 700; color: white; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px 20px 100px; }
        .card { display: flex; align-items: center; gap: 14px; padding: 20px; background: rgba(255,255,255,0.95); border-radius: 20px; text-decoration: none; color: inherit; transition: all 0.3s; box-shadow: 0 15px 40px rgba(0,0,0,0.15); margin-bottom: 16px; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .card-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; color: white; background: linear-gradient(135deg, #667eea, #764ba2); }
        .card-content { flex: 1; }
        .card-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
        .card-subtitle { font-size: 14px; color: #64748b; }
        .card-tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: rgba(239,68,68,0.1); color: #ef4444; }
        .card-arrow { color: #94a3b8; font-size: 20px; font-weight: 300; }
        .section-title { font-size: 20px; font-weight: 700; margin: 24px 0 16px; color: white; display: flex; align-items: center; gap: 8px; }
        footer { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.6); font-size: 12px; }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/daily-news-insight/" style="color: white; text-decoration: none;">
                <span class="header-title">📊 市场洞察中心</span>
            </a>
        </div>
    </header>
    <div class="container">
        
        <div class="section-title">
            <span>📰</span> 周末速递
        </div>
        
        <a href="/daily-news-insight/%E5%91%A8%E6%9C%AB%E9%80%9F%E9%80%92/20260524_%E5%91%A8%E6%9C%AB%E9%80%9F%E9%80%92.html" class="card">
            <div class="card-icon">
                <i class="fas fa-newspaper"></i>
            </div>
            <div class="card-content">
                <div class="card-title">周末速递 - 2026年5月24日</div>
                <div class="card-subtitle">八部门整治跨境证券+城市更新规划+下周催化日历</div>
            </div>
            <span class="card-tag">最新</span>
            <span class="card-arrow">›</span>
        </a>

    </div>
    <footer>
        <p>市场洞察中心 · 投资决策助手</p>
    </footer>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
</body>
</html>
