<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能选题助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif; 
            background: #f8fafc; 
            color: #1e293b; 
            line-height: 1.6; 
            min-height: 100vh;
        }
        .header { position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.06); z-index: 100; padding: 0 24px; }
        .header-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; }
        .header-title { font-size: 17px; font-weight: 700; background: linear-gradient(135deg, #ec4899, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-date { font-size: 13px; color: #94a3b8; }
        .back-btn { color: #94a3b8; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 4px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px 20px 100px; }
        .card {
            background: white;
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .coming-soon { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .coming-soon-icon { font-size: 48px; margin-bottom: 16px; }
        .coming-soon-text { font-size: 16px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/daily-news-insight/" class="back-btn">← 返回</a>
            <span class="header-title">🎯 智能选题助手</span>
            <span class="header-date" id="today">5月21日</span>
        </div>
    </header>
    
    <div class="container">
        <div class="coming-soon">
            <div class="coming-soon-icon">🎯</div>
            <div class="coming-soon-text">AI驱动题材挖掘系统</div>
            <p style="margin-top:12px;font-size:13px;color:#94a3b8;">建设中，敬请期待</p>
        </div>
    </div>
    
    <script>
        const now = new Date();
        document.getElementById('today').textContent = `${now.getMonth()+1}月${now.getDate()}日`;
    </script>
</body>
</html>
